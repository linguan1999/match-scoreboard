<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比分接收端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #14171c; color: #e8eaed; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: #1c2027; border-bottom: 1px solid #2a2f38;
  }
  header h1 { font-size: 19px; font-weight: 600; letter-spacing: 2px; }
  .status-pill {
    font-size: 13px; padding: 4px 12px; border-radius: 12px;
    background: #3a2a2a; color: #ff9a9a;
  }
  .status-pill.ok { background: #1f3a2a; color: #7de3a8; }
  .status-pill.warn { background: #3a3423; color: #f0cf7d; }
  #csvStatus { font-size: 13px; padding: 4px 12px; border-radius: 12px; background: #3a2a2a; color: #ff9a9a; }
  #csvStatus.ok { background: #1f3a2a; color: #7de3a8; }
  .spacer { flex: 1; }
  .btn {
    padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px;
    background: #2f6fed; color: #fff; cursor: pointer;
  }
  .btn:hover { background: #4a82f5; }
  .btn.ghost { background: #3a4150; }
  .btn.ghost:hover { background: #4a5366; }

  /* 配置面板 */
  .config-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 20px; background: #181c22; border-bottom: 1px solid #2a2f38;
  }
  .config-bar label { font-size: 13px; color: #9aa3b2; }
  .config-bar input {
    padding: 7px 10px; font-size: 13px; border-radius: 6px;
    border: 1px solid #3a4150; background: #14171c; color: #fff; outline: none;
  }
  .config-bar input:focus { border-color: #2f6fed; }
  .config-bar input.url { width: 320px; }
  .config-bar input.key { width: 200px; }

  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .court {
    background: #1c2027; border: 1px solid #2a2f38; border-radius: 12px;
    display: flex; flex-direction: column; padding: 16px; gap: 14px;
  }
  .court-head { display: flex; align-items: center; justify-content: space-between; }
  .court-title { font-size: 18px; font-weight: 600; color: #9aa3b2; letter-spacing: 2px; }
  .badge { font-size: 13px; padding: 4px 14px; border-radius: 12px; background: #2a2f38; color: #9aa3b2; }
  .badge.running { background: #1f3a2a; color: #7de3a8; }
  .badge.paused  { background: #3a3423; color: #f0cf7d; }
  .badge.idle    { background: #2a2f38; color: #9aa3b2; }
  .badge.ready   { background: #233a4a; color: #7dc4f0; }

  .timer {
    text-align: center; font-size: 56px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: 3px; color: #f0f2f5;
  }
  .teams { display: flex; flex-direction: column; gap: 12px; }
  .team {
    display: grid; grid-template-columns: 1fr 110px;
    align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px;
  }
  .team.a { background: rgba(47,111,237,.12); border: 1px solid rgba(47,111,237,.35); }
  .team.b { background: rgba(237,80,80,.10); border: 1px solid rgba(237,80,80,.35); }
  .team .name {
    font-size: 24px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .team.a .name { color: #7aa7ff; }
  .team.b .name { color: #ff8f8f; }
  .team .score {
    font-size: 56px; font-weight: 800; text-align: center;
    font-variant-numeric: tabular-nums; color: #f0f2f5;
  }

  .empty { color: #5a6273; font-style: italic; text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<header>
  <h1>比分接收端</h1>
  <span id="connStatus" class="status-pill">未连接</span>
  <span id="csvStatus">CSV 未绑定</span>
  <div class="spacer"></div>
  <span id="lastUpdate" style="font-size:13px;color:#9aa3b2;"></span>
  <button id="btnBindCsv" class="btn">绑定 CSV 文件</button>
</header>

<div class="config-bar">
  <label>云端地址</label>
  <input id="cfgUrl" class="url" placeholder="http://YOUR_SERVER_IP:8080">
  <label>同步口令</label>
  <input id="cfgKey" class="key" placeholder="CHANGE_ME_SECRET">
  <button id="btnApply" class="btn ghost">应用</button>
</div>

<main id="courts"></main>

<script>
"use strict";

/* ================= 保持后台轮询（防止最小化后 vMix 卡死） =================
 * 浏览器最小化/切到后台时会把 setInterval 节流（隐藏 5 分钟后更是压到每分钟 1 次），
 * 导致 CSV 不再更新、vMix 卡死。
 * 解法分两层：
 *   A. exe 启动 Edge 时已带 --disable-background-timer-throttling 等参数（见 Program.cs），
 *      从根上禁掉后台节流和遮挡判定；
 *   B. 页面内用"正在播放音频"豁免兜底——注意 Chromium 只豁免"真的在出声"的页面，
 *      gain=0 的纯静音流不算 audible，必须给一个非零但人耳听不到的信号：
 *      1Hz 振荡器（低于人耳下限 20Hz，扬声器放不出来）+ 0.0001 增益。
 * AudioContext 因自动播放策略需要用户手势才能启动，这里做三层保障：
 *   1. 任意 pointerdown（点击/触摸/鼠标）唤醒
 *   2. visibilitychange 切到前台时，主动创建/恢复并立即刷一次数据
 *   3. 页面加载后延迟 1.5s 自动尝试（短延迟内浏览器可能放行）
 */
let audioCtx = null, audioStarted = false;
function keepAwake() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) {
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    if (!audioStarted) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 1;          // 1Hz 人耳不可闻
      gain.gain.value = 0.0001;         // 非零信号 → Chromium 判定 audible → 豁免后台节流
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      audioStarted = true;
    }
  } catch (e) { /* 不支持就放弃，退化为普通节流 */ }
}
// 可见性变化：切到前台时拉起音频，并立刻刷一次数据，避免恢复窗口后长时间显示旧比分
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { keepAwake(); fetchState(); }
});
// 页面加载后延迟自动尝试一次（短窗口内浏览器可能放行，用户无需先点一下）
window.addEventListener("load", () => setTimeout(keepAwake, 1500));

/* ================= 配置 ================= */
const CFG_KEY = "receiver-cfg-v1";
const DEFAULT_CFG = {
  url: "http://YOUR_SERVER_IP:8080",
  key: "CHANGE_ME_SECRET"
};

let cfg = { ...DEFAULT_CFG };
function loadCfg() {
  try {
    const raw = localStorage.getItem(CFG_KEY);
    if (raw) cfg = { ...DEFAULT_CFG, ...JSON.parse(raw) };
  } catch (e) {}
}
function saveCfg() { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

/* ================= 状态 ================= */
const STATUS_TEXT = { idle: "未开始", ready: "待启动", running: "进行中", paused: "已暂停" };

let lastData = null;      // 最近一次从云端拿到的 courts 数组
let recvMs = 0;           // 收到该快照的本地时刻(ms)
let serverTs = 0;         // 云端时间戳(秒)
let failCount = 0;

/* ---- 本机计时：只响应命令（状态跳变），时间在本机跑，不跟随每次快照重锚 ---- */
const timers = {};        // 每场地：{ status, baseMs, runStartMs }

function updateTimers(courts) {
  const now = Date.now();
  courts.forEach((c, i) => {
    const t = timers[i] || (timers[i] = { status: "idle", baseMs: 0, runStartMs: null });
    const ns = c.status || "idle";
    if (ns === "running" && t.status !== "running") {
      // 启动/继续命令：以推送的累计值为底，本机时钟起走
      t.baseMs = c.elapsedMs || 0;
      t.runStartMs = now;
    } else if (ns !== "running") {
      // 暂停/结束/新建：定格为推送的累计值
      t.baseMs = c.elapsedMs || 0;
      t.runStartMs = null;
    }
    // running→running：不动，时间完全由本机走
    t.status = ns;
  });
}

function elapsedOf(i, c) {
  const t = timers[i];
  if (!t) return (c && c.elapsedMs) || 0;
  if (t.status === "running" && t.runStartMs != null) return t.baseMs + (Date.now() - t.runStartMs);
  return t.baseMs;
}

function fmtTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/* ================= 拉取云端 ================= */
async function fetchState() {
  try {
    const url = cfg.url.replace(/\/+$/, "") + "/state?key=" + encodeURIComponent(cfg.key);
    const resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();
    if (json && json.data && Array.isArray(json.data.courts)) {
      lastData = json.data.courts;
      recvMs = Date.now();
      serverTs = json.ts || 0;
      updateTimers(lastData);   // 只响应启动/暂停等命令
      failCount = 0;
      setConn(true);
      render();
      writeCSV();
    } else {
      // 云端暂无数据（还没开始打分）
      lastData = null;
      failCount = 0;
      setConn(true);
      render();
    }
  } catch (e) {
    failCount++;
    setConn(false);
  }
  updateLastUpdate();
}

function setConn(ok) {
  const el = document.getElementById("connStatus");
  if (ok) { el.textContent = "已连接"; el.className = "status-pill ok"; }
  else { el.textContent = "连接失败 · 重试中"; el.className = "status-pill warn"; }
}

function updateLastUpdate() {
  const el = document.getElementById("lastUpdate");
  if (recvMs) {
    const age = Math.floor((Date.now() - recvMs) / 1000);
    el.textContent = "最近更新 " + (age < 1 ? "刚刚" : age + " 秒前");
  } else {
    el.textContent = "等待数据…";
  }
}

/* ================= 渲染 ================= */
const courtsEl = document.getElementById("courts");

function courtDisplay(c, idx) {
  // 时间在本机跑：只响应启动/暂停命令（见 updateTimers）
  return { elapsed: elapsedOf(idx, c) };
}

function render() {
  courtsEl.innerHTML = "";
  if (!lastData) {
    courtsEl.innerHTML = '<div class="empty" style="grid-column:1/-1;">等待云端数据…<br>请在手机端 referee.html 创建场次并打分</div>';
    return;
  }
  lastData.forEach((c, i) => courtsEl.appendChild(renderCourt(c, i)));
}

function renderCourt(c, i) {
  const div = document.createElement("div");
  div.className = "court";
  const status = c.status || "idle";
  const badgeCls = "badge " + status;
  const disp = courtDisplay(c, i);

  if (status === "idle") {
    div.innerHTML = `
      <div class="court-head">
        <span class="court-title">场地 ${i + 1}</span>
        <span class="${badgeCls}">${STATUS_TEXT[status] || status}</span>
      </div>
      <div class="empty">未开始</div>`;
  } else {
    const scoreA = (status === "idle") ? "" : (c.scoreA ?? "");
    const scoreB = (status === "idle") ? "" : (c.scoreB ?? "");
    div.innerHTML = `
      <div class="court-head">
        <span class="court-title">场地 ${i + 1}</span>
        <span class="${badgeCls}">${STATUS_TEXT[status] || status}</span>
      </div>
      <div class="timer">${fmtTime(disp.elapsed)}</div>
      <div class="teams">
        <div class="team a">
          <span class="name">${esc(c.teamA || "")}</span>
          <span class="score">${scoreA}</span>
        </div>
        <div class="team b">
          <span class="name">${esc(c.teamB || "")}</span>
          <span class="score">${scoreB}</span>
        </div>
      </div>`;
  }
  return div;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

/* ================= CSV 输出（vMix 数据源） ================= */
let csvFileHandle = null;

function csvCell(v) {
  v = String(v);
  return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function buildCSV() {
  const rows = [["场地", "A队伍", "A队得分", "B队伍", "B队得分", "比赛时间", "状态"]];
  const courts = lastData || [];
  for (let i = 0; i < 2; i++) {
    const c = courts[i];
    if (c) {
      const status = c.status || "idle";
      const disp = courtDisplay(c, i);
      const scoreA = status === "idle" ? "" : (c.scoreA ?? "");
      const scoreB = status === "idle" ? "" : (c.scoreB ?? "");
      rows.push([
        "场地" + (i + 1),
        c.teamA || "", scoreA,
        c.teamB || "", scoreB,
        fmtTime(disp.elapsed),
        STATUS_TEXT[status] || status
      ]);
    } else {
      rows.push(["场地" + (i + 1), "", "", "", "", "00:00", "未开始"]);
    }
  }
  // UTF-8 BOM，保证 vMix 正确识别中文编码
  return "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}

let writing = false, writePending = false;
async function writeCSV() {
  if (!csvFileHandle) return;
  if (writing) { writePending = true; return; }
  writing = true;
  try {
    const w = await csvFileHandle.createWritable();
    await w.write(buildCSV());
    await w.close();
    setCsvStatus(true);
  } catch (e) {
    setCsvStatus(false);
  }
  writing = false;
  if (writePending) { writePending = false; writeCSV(); }
}

function setCsvStatus(ok) {
  const el = document.getElementById("csvStatus");
  if (!csvFileHandle) { el.textContent = "CSV 未绑定"; el.className = ""; return; }
  if (ok) { el.textContent = "CSV 已绑定：" + csvFileHandle.name; el.className = "ok"; }
  else { el.textContent = "CSV 写入失败，请重新绑定"; el.className = ""; }
}

async function bindCSV() {
  try {
    csvFileHandle = await showSaveFilePicker({
      suggestedName: "score.csv",
      types: [{ description: "CSV 文件", accept: { "text/csv": [".csv"] } }]
    });
    await saveHandle(csvFileHandle);
    await writeCSV();
  } catch (e) { /* 用户取消 */ }
}

/* ---- 句柄存入 IndexedDB，刷新后自动恢复 ---- */
function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("receiver-db", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function saveHandle(handle) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(handle, "csvHandle");
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function loadHandle() {
  try {
    const db = await idbOpen();
    const handle = await new Promise((res, rej) => {
      const req = db.transaction("kv", "readonly").objectStore("kv").get("csvHandle");
      req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
    });
    if (!handle) return;
    if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") {
      csvFileHandle = handle;
      writeCSV();
    }
  } catch (e) {}
  setCsvStatus(!!csvFileHandle);
}

/* ================= 计时器（running 场地每秒刷新显示+写CSV） ================= */
setInterval(() => {
  if (lastData && lastData.some(c => c.status === "running")) {
    render();
    writeCSV();
  }
  updateLastUpdate();
}, 1000);

/* ================= 配置应用 ================= */
document.getElementById("btnApply").addEventListener("click", () => {
  keepAwake();
  cfg.url = document.getElementById("cfgUrl").value.trim().replace(/\/+$/, "");
  cfg.key = document.getElementById("cfgKey").value.trim();
  saveCfg();
  fetchState();
});

/* ================= 启动 ================= */
document.getElementById("btnBindCsv").addEventListener("click", () => { keepAwake(); bindCSV(); });

// 任意首次点击即唤醒音频上下文，满足自动播放策略
document.addEventListener("pointerdown", keepAwake, { once: false });

loadCfg();
document.getElementById("cfgUrl").value = cfg.url;
document.getElementById("cfgKey").value = cfg.key;
loadHandle();
render();
fetchState();
setInterval(fetchState, 1000);
</script>
</body>
</html>
